# EdgeMJ 麻將辨識資料集設定（Ultralytics YOLO 格式）
#
# 沒有寫 path，YOLO 會以「這個檔案所在的資料夾」當作資料集根目錄，
# 所以從哪個資料夾執行訓練都不會找錯路徑。
#
# 類別編號 0~33 與 App 的 Tile id 完全相同（lib/core/mahjong/tile.dart），
# 辨識結果可直接轉成 Tile；34~41 是花牌，計算聽牌時會排除。
# ⚠ 類別順序一旦開始標註就不要再改，否則所有標註檔都要重做。

train: images/train
val: images/val
test: images/test

nc: 42

names:
  # ── 萬子 ──
  0: 1m   # 一萬
  1: 2m   # 二萬
  2: 3m   # 三萬
  3: 4m   # 四萬
  4: 5m   # 五萬
  5: 6m   # 六萬
  6: 7m   # 七萬
  7: 8m   # 八萬
  8: 9m   # 九萬
  # ── 筒子 ──
  9: 1p   # 一筒
  10: 2p  # 二筒
  11: 3p  # 三筒
  12: 4p  # 四筒
  13: 5p  # 五筒
  14: 6p  # 六筒
  15: 7p  # 七筒
  16: 8p  # 八筒
  17: 9p  # 九筒
  # ── 條子 ──
  18: 1s  # 一條
  19: 2s  # 二條
  20: 3s  # 三條
  21: 4s  # 四條
  22: 5s  # 五條
  23: 6s  # 六條
  24: 7s  # 七條
  25: 8s  # 八條
  26: 9s  # 九條
  # ── 字牌 ──
  27: 1z  # 東
  28: 2z  # 南
  29: 3z  # 西
  30: 4z  # 北
  31: 5z  # 中
  32: 6z  # 發
  33: 7z  # 白
  # ── 花牌（台灣牌）：依牌面上的數字排序，春1夏2秋3冬4、梅1蘭2菊3竹4 ──
  34: 1f  # 春
  35: 2f  # 夏
  36: 3f  # 秋
  37: 4f  # 冬
  38: 5f  # 梅
  39: 6f  # 蘭
  40: 7f  # 菊
  41: 8f  # 竹
