name: edge_mj
description: "EdgeMJ：完全離線的麻將聽牌辨識輔助 App（Edge AI：YOLO + TFLite）"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  image: ^4.13.1
  image_picker: ^1.2.4
  tflite_flutter: ^0.12.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  # 辨識模型（由 ml/exports/ 複製過來，float16 版）
  assets:
    - assets/models/edgemj_float16.tflite
    - assets/models/labels.txt
